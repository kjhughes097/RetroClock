[env]
monitor_filters = time
platform = espressif32
custom_html_input = lib/WebPrefs/html
custom_html_output = lib/WebPrefs
board = esp32dev
framework = arduino
extra_scripts = pre:minify.py
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions_retroclock.csv

lib_deps =
	lovyan03/LovyanGFX@^1.1.16
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
    bblanchon/ArduinoJson

[env:cyd-retroclock-debug]
build_type = debug
build_unflags = -std=gnu++11
build_flags = -std=c++17 -std=gnu++17 -DDEBUG -DLOG_SERIAL_LEVEL=15

[env:cyd-retroclock-test]
build_type = release
build_unflags = -std=gnu++11
build_flags = -std=c++17 -std=gnu++17 -DTEST -DNDEBUG -Os -DLOG_SERIAL_LEVEL=7

[env:cyd-retroclock-prod]
build_type = release
build_unflags = -std=gnu++11
build_flags = -std=c++17 -std=gnu++17 -DNDEBUG -Os
extra_scripts = pre:minify.py, post:uploadlfs.py